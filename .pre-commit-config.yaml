default_install_hook_types: [pre-commit, commit-msg]

repos:
  # ---------- Generic repository hygiene checks ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-yaml
      - id: check-ast # valida conanfile.py e test_package/conanfile.py
      - id: debug-statements # pega print()/pdb esquecidos nos conanfiles

  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22 # rode `prek autoupdate` para pegar a atual
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  # ---------- C++ Formatting (headers .hpp and sources .cpp) ----------
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c]
        args: [-i, --style=file]

  # ---------- Formatting of CMakeLists.txt (root and test_package) ----------
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        args: [--in-place]
      - id: cmake-lint
        args: [--disabled-codes, C0301] # allows long lines in FATAL_ERROR messages in pt-BR

  # ---------- Light static lint for C++ ----------
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.4.0
    hooks:
      - id: cppcheck
        exclude: ^examples/
        args:
          - --enable=warning,performance,portability
          - --std=c++20
          - --language=c++
          - --suppress=missingIncludeSystem
          - --error-exitcode=1

  # ---------- Python (conanfile.py from the root and from test_package) ----------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ---------- Light spelling correction (comments in pt-BR and en) ----------
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.4.0
    hooks:
      - id: cspell
        name: check code spelling
        stages: [pre-commit]
        additional_dependencies:
          - "@cspell/dict-pt-br"
          - "@cspell/dict-en-gb"
      - id: cspell
        name: check commit message spelling
        stages: [commit-msg]
        additional_dependencies:
          - "@cspell/dict-pt-br"
          - "@cspell/dict-en-gb"

default_language_version:
  python: python3

exclude: ^(build|test_package/build|cmake-build-[^/]+|examples/dredd)/
